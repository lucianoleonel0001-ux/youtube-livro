<input type="file" id="inputAudio" accept="audio/*">
<button onclick="enviarAudio('ID_DO_PEDIDO')">Aprovar e Processar</button>

<script>
async function enviarAudio(jobId) {
  const file = document.getElementById('inputAudio').files[0];
  if (!file) return alert('Selecione o MP3 primeiro!');

  const formData = new FormData();
  formData.append('audio', file);

  const res = await fetch(`/api/upload-audio/${jobId}`, {
    method: 'POST',
    body: formData
  });
  
  if (res.ok) alert('Processamento iniciado!');
}
</script>
