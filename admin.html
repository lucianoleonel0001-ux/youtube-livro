<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Admin - Lucel Digital</title>
</head>
<body>
    <div style="padding: 20px; font-family: sans-serif;">
        <input type="file" id="audio" accept="audio/mp3">
        <button onclick="processar()" style="cursor: pointer; padding: 5px 15px;">Aprovar e Processar</button>
    </div>

    <script>
        async function processar() {
            const fileInput = document.getElementById('audio');
            if (!fileInput.files[0]) return alert("Selecione o arquivo!");

            const formData = new FormData();
            formData.append('audio', fileInput.files[0]);

            try {
                const response = await fetch('/api/processar', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                alert(data.mensagem || "Sucesso!");
            } catch (error) {
                alert("Erro ao conectar com o servidor.");
            }
        }
    </script>
</body>
</html>
