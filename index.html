<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucel Digital — Área do Cliente</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            color: #1a73e8;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #666;
            line-height: 1.5;
        }
        .btn-admin {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            background-color: #1a73e8;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-admin:hover {
            background-color: #1557b0;
        }
        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Lucel Digital</h1>
        <p>Sua plataforma inteligente de automação editorial e criação de livros.</p>
        
        <div style="border-top: 1px solid #eee; margin: 20px 0;"></div>
        
        <p>Acesse o painel para gerenciar seus projetos:</p>
        <a href="/admin" class="btn-admin">Ir para o Painel Administrativo</a>
        
        <div class="footer">
            © 2026 Lucel Digital — Tecnologia e Design
        </div>
    </div>

</body>
</html>
